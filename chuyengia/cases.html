<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách ca - Chuyên gia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <img src="logo.png" alt="Docah logo">
        </div>
        <div>
          <h1>Docah</h1>
          <p>Hệ thống chuyên gia</p>
        </div>
      </div>
      <nav class="nav-menu">
        <a class="nav-link" href="dashboard.html"><span class="icon">🏠</span><span>Trang chủ</span></a>
        <a class="nav-link active" href="cases.html"><span class="icon">📋</span><span>Danh sách ca</span></a>
        <a class="nav-link" href="responses.html"><span class="icon">💬</span><span>Phản hồi</span></a>
        <a class="nav-link" href="reports.html"><span class="icon">📊</span><span>Báo cáo</span></a>
        <a class="nav-link" href="profile.html"><span class="icon">👤</span><span>Hồ sơ cá nhân</span></a>
      </nav>
    </aside>

    <main class="content">
      <div class="topbar">
        <div class="topbar-title">
          <h2>Danh sách ca</h2>
          <p>Tìm kiếm, lọc trạng thái và mở nhanh hồ sơ cần tư vấn.</p>
        </div>
        <div class="account-menu">
          <button class="account-button" id="accountToggle" type="button">
            <div class="dot">A</div>
            <div>
              <div style="font-weight:700;">BS. Nguyễn Văn A</div>
              <div style="font-size:0.9rem; color: var(--muted);">Chuyên gia</div>
            </div>
          </button>
          <div class="dropdown" id="accountDropdown">
            <div class="dropdown-illustration">
              <img src="logo.png" alt="Illustration" />
              <div><strong>Tài khoản </strong><span>Quản lý phiên đăng nhập</span></div>
            </div>
            <button class="dropdown-item" type="button" id="logoutButton">Đăng xuất</button>
          </div>
        </div>
      </div>

      <section class="card filter">
        <input id="searchInput" placeholder="Tìm theo tên bệnh nhân hoặc vấn đề...">
        <select id="statusFilter">
          <option value="all">Tất cả trạng thái</option>
          <option>Mới</option>
          <option>Đang xử lý</option>
          <option>Đã phản hồi</option>
          <option>Đã hoàn thành</option>
        </select>
      </section>
      <section class="card">
        <h3>Danh sách ca</h3>
        <div id="caseList"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="../shared-toast.js"></script>
</body>
</html>
