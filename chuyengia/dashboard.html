<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Chuyên gia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <img src="logo.png" alt="Docah logo">
        </div>
        <div>
          <h1>Docah</h1>
          <p>Hệ thống chuyên gia</p>
        </div>
      </div>
      <nav class="nav-menu">
        <a class="nav-link active" href="dashboard.html"><span class="icon">🏠</span><span>Trang chủ</span></a>
        <a class="nav-link" href="cases.html"><span class="icon">📋</span><span>Danh sách ca</span></a>
        <a class="nav-link" href="responses.html"><span class="icon">💬</span><span>Phản hồi</span></a>
        <a class="nav-link" href="reports.html"><span class="icon">📊</span><span>Báo cáo</span></a>
        <a class="nav-link" href="profile.html"><span class="icon">👤</span><span>Hồ sơ cá nhân</span></a>
      </nav>
    </aside>

    <main class="content">
      <div class="topbar">
        <div class="topbar-title">
          <h2>Trang chủ</h2>
          <p>Theo dõi ca mới, phản hồi chưa đọc và hoạt động tư vấn gần đây.</p>
        </div>
        <div class="account-menu">
          <button class="account-button" id="accountToggle" type="button">
            <div class="dot">A</div>
            <div>
              <div style="font-weight:700;">BS. Nguyễn Văn A</div>
              <div style="font-size:0.9rem; color: var(--muted);">Chuyên gia</div>
            </div>
          </button>
          <div class="dropdown" id="accountDropdown">
            <div class="dropdown-illustration">
              <img src="logo.png" alt="Illustration" />
              <div>
                <strong>Tài khoản </strong>
                <span>Quản lý phiên đăng nhập</span>
              </div>
            </div>
            <button class="dropdown-item" type="button" id="logoutButton">Đăng xuất</button>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div><p>Ca mới hôm nay</p><strong>2</strong></div>
          <span class="stat-icon">📄</span>
        </div>
        <div class="stat">
          <div><p>Phản hồi chưa đọc</p><strong>3</strong></div>
          <span class="stat-icon">💬</span>
        </div>
        <div class="stat">
          <div><p>Ca tháng này</p><strong>24</strong></div>
          <span class="stat-icon">📅</span>
        </div>
      </div>

      <section class="card">
        <div class="card-head">
          <h3>5 ca gần nhất</h3>
          <a class="btn" href="cases.html">Xem tất cả</a>
        </div>
        <div id="recentCases"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
