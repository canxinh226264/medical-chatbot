<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Chuyên gia UI/UX</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared-theme.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua tới nội dung</a>
  <section class="login-page">
    <form id="main-content" class="login-card" onsubmit="location.href='dashboard.html';return false;">
      <div class="login-logo">
        <img src="logo.png" alt="Docah logo">
      </div>
      <h1>Hệ thống Chuyên gia UI/UX</h1>
      <p>Đăng nhập để theo dõi phản hồi người dùng, đánh giá trải nghiệm và gửi đề xuất cải tiến giao diện.</p>
      <label for="email">Email</label>
      <input id="email" type="email" value="expert@hospital.vn" required>
      <label for="password">Mật khẩu</label>
      <div class="password-field">
        <input id="password" type="password" value="123456" required>
        <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">👁</button>
      </div>
      <button class="primary" type="submit">Đăng nhập</button>
      <a href="#">Quên mật khẩu?</a>
    </form>
  </section>
  <script>
    document.querySelectorAll('[data-toggle-password]').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.togglePassword);
        if (!input) return;
        // Toggle type
        input.type = input.type === 'password' ? 'text' : 'password';
        // Set accessible label describing the next action
        const isHiddenNow = input.type === 'password';
        button.textContent = isHiddenNow ? '👁' : '🙈';
        button.setAttribute('aria-label', isHiddenNow ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
        input.focus();
      });
    });
  </script>
  <script src="../shared-toast.js"></script>
</body>
</html>
