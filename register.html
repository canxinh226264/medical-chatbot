<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docah - Đăng ký</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 35%),
                  linear-gradient(180deg, #0f172a 0%, #111827 48%, #0f172a 100%);
      color: #0f172a;
    }

    .register-box {
      width: min(100%, 560px);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: 0 32px 80px rgba(15, 23, 42, 0.18);
      padding: 52px 48px;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.18);
      position: relative;
      overflow: hidden;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 20px 60px rgba(59, 130, 246, 0.16);
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      border: 4px solid rgba(255, 255, 255, 0.65);
    }

    .logo-text {
      font-size: 40px;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: -1.5px;
    }

    h1 {
      font-size: 30px;
      color: #172554;
      margin: 10px 0 8px;
    }

    .welcome {
      color: #475569;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #334155;
      font-weight: 600;
      font-size: 15px;
    }

    /* === CUSTOM DROPDOWN === */
    .custom-select {
      position: relative;
    }

    .select-button {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      background: #f8fafc;
      font-size: 16px;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .select-button:hover {
      border-color: #3b82f6;
    }

    .select-button:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
    }

    .select-button .arrow {
      font-size: 18px;
      color: #64748b;
      transition: transform 0.3s ease;
    }

    .select-menu {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 8px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
      max-height: 280px;
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 10;
    }

    .custom-select.open .select-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .custom-select.open .arrow {
      transform: rotate(180deg);
    }

    .select-option {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .select-option:hover {
      background: #f0f9ff;
    }

    .select-option.selected {
      background: #e0f2fe;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      background: #f8fafc;
      font-size: 16px;
      color: #0f172a;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 54px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #64748b;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .password-toggle:hover {
      transform: translateY(-50%);
      background: #e0f2fe;
      color: #2563eb;
      box-shadow: none;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin: 10px 0 22px;
      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(59, 130, 246, 0.26);
    }

    .footer {
      color: #64748b;
      font-size: 15px;
    }

    .footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <link rel="stylesheet" href="shared-theme.css">
</head>
<body>
  <div class="register-box">
    <div class="logo-container">
      <img src="logo.png" alt="Docah Logo" class="logo">
    </div>

    <h1>Đăng ký tài khoản</h1>
    <p class="welcome">Tạo tài khoản mới để truy cập hệ thống Docah</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@docah.vn" required>
      </div>

      <!-- Custom Dropdown đẹp hơn -->
      <div class="form-group">
        <label for="role">Vai trò</label>
        <div class="custom-select" id="customSelect">
          <div class="select-button" id="selectButton">
            <span id="selectedText">Chọn vai trò</span>
            <span class="arrow">▼</span>
          </div>
          <div class="select-menu" id="selectMenu">
            <div class="select-option" data-value="expert">👨‍🔬 Chuyên gia</div>
            <div class="select-option" data-value="doctor">👨‍⚕️ Bác sĩ</div>
            <div class="select-option" data-value="manager">🏥 Quản lí chuỗi phòng khám</div>
            <div class="select-option" data-value="patient">🧑 Người cần khám</div>
          </div>
        </div>
        <input type="hidden" id="role" name="role" required>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="password-field">
          <input type="password" id="password" placeholder="Nhập mật khẩu" required>
          <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Xác nhận mật khẩu</label>
        <div class="password-field">
          <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" required>
          <button class="password-toggle" type="button" data-toggle-password="confirm-password" aria-label="Hiện xác nhận mật khẩu" title="Hiện mật khẩu">👁</button>
        </div>
      </div>

      <!-- Mã PIN -->
      <div class="form-group" id="pinGroup" style="display: none;">
        <label for="pin">Mã PIN (6 số)</label>
        <div class="password-field">
          <input type="password" id="pin" maxlength="6" placeholder="Nhập mã PIN quản lý">
          <button class="password-toggle" type="button" data-toggle-password="pin" aria-label="Hiện mã PIN" title="Hiện mã PIN">👁</button>
        </div>
      </div>

      <button type="submit">Đăng ký</button>
    </form>

    <div class="footer">
      Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
    </div>
  </div>

  <script>
    const customSelect = document.getElementById('customSelect');
    const selectButton = document.getElementById('selectButton');
    const selectMenu = document.getElementById('selectMenu');
    const selectedText = document.getElementById('selectedText');
    const roleInput = document.getElementById('role');
    const pinGroup = document.getElementById('pinGroup');
    const registerForm = document.getElementById('registerForm');

    // Mở / đóng dropdown
    selectButton.addEventListener('click', () => {
      customSelect.classList.toggle('open');
    });

    // Chọn option
    document.querySelectorAll('.select-option').forEach(option => {
      option.addEventListener('click', () => {
        const value = option.getAttribute('data-value');
        const text = option.textContent.trim();

        selectedText.textContent = text;
        roleInput.value = value;
        customSelect.classList.remove('open');

        // Hiển thị ô mã PIN nếu là Quản lí chuỗi phòng khám
        if (value === 'manager') {
          pinGroup.style.display = 'block';
          document.getElementById('pin').required = true;
        } else {
          pinGroup.style.display = 'none';
          document.getElementById('pin').required = false;
          document.getElementById('pin').value = '';
        }
      });
    });

    // Đóng dropdown khi click ra ngoài
    document.addEventListener('click', (e) => {
      if (!customSelect.contains(e.target)) {
        customSelect.classList.remove('open');
      }
    });

    // Xử lý form đăng ký
    registerForm.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!roleInput.value) {
        alert("Vui lòng chọn vai trò!");
        return;
      }

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const pin = document.getElementById('pin').value;

      if (password !== confirmPassword) {
        alert("Mật khẩu và xác nhận mật khẩu không khớp!");
        return;
      }

      if (roleInput.value === 'manager') {
        if (!pin || pin.length !== 6 || pin !== "123456") {
          alert("Mã PIN không đúng! Vui lòng nhập đúng mã PIN 6 số.");
          return;
        }
      }

      alert("Đăng ký tài khoản thành công!\n\nChào mừng bạn đến với Docah.");
      window.location.href = "login.html";
    });
    document.querySelectorAll('[data-toggle-password]').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.togglePassword);
        if (!input) return;
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        button.textContent = isHidden ? '🙈' : '👁';
        button.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        input.focus();
      });
    });
  </script>
</body>
</html>
