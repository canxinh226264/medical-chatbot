
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docah Dashboard</title>
    <link rel="stylesheet" href="public/styles/main.css" />
    <link rel="stylesheet" href="public/styles/components.css" />
    <link rel="stylesheet" href="public/styles/responsive.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Mở menu">☰</button>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="app-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-container">
            <div class="logo-pill">
              <img class="logo-image" src="public/assets/logo.png" alt="Docah Logo" />
            </div>
            <div class="logo-text">
              <h1>Docah</h1>
              <p>Hệ thống quản lý</p>
            </div>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
          <div class="user-info">
            <div class="user-avatar">BS</div>
            <div>
              <p class="user-name">BS. Nguyễn Văn A</p>
              <p class="user-role">Bác sĩ nội khoa</p>
            </div>
          </div>
          <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
        </div>
      </aside>
      <main class="main-content" id="app"></main>
    </div>
    <div class="modal" id="modal"></div>
    <script src="scripts/app.js"></script>
  </body>
</html>
