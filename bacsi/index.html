
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Bác sĩ - Docah</title>
    <link rel="stylesheet" href="public/styles/main.css" />
    <link rel="stylesheet" href="public/styles/components.css" />
    <link rel="stylesheet" href="public/styles/responsive.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="../shared-theme.css" />
  </head>
  <body>
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Mở menu">☰</button>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="app-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-container">
            <div class="logo-pill">
              <img class="logo-image" src="../logo.png" alt="Docah Logo" />
            </div>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
      </aside>
      <main class="main-content">
        <header class="doctor-topbar">
          <div>
            <h2>Không gian bác sĩ</h2>
            <p>Quản lý tư vấn, hồ sơ bệnh nhân và cảnh báo y tế.</p>
          </div>
          <div class="account-menu">
            <button class="account-button" id="accountToggle" type="button" aria-expanded="false">
              <div class="dot">BS</div>
              <div>
                <strong>BS. Nguyễn Văn A</strong>
                <small>Bác sĩ nội khoa</small>
              </div>
            </button>
            <div class="account-dropdown dropdown" id="accountDropdown">
              <div class="dropdown-illustration">
                <img src="../logo.png" alt="Docah logo" />
                <div>
                  <strong>Đăng xuất</strong>
                  <span>Thoát khỏi phiên bác sĩ hiện tại</span>
                </div>
              </div>
              <button class="account-dropdown-item dropdown-item logout-btn" id="logoutBtn" type="button">Đăng xuất</button>
            </div>
          </div>
        </header>
        <div class="page-content" id="app"></div>
      </main>
    </div>
    <div class="modal" id="modal"></div>
    <script src="scripts/app.js"></script>
    <script src="../shared-toast.js"></script>
</body>
</html>
